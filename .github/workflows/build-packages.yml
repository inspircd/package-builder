name: Build packages
on:
  pull_request:
  push:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      INSPIRCD_VERSION: ${{ steps.version.outputs.INSPIRCD_VERSION }}
    steps:
      - name: Retrieve latest release
        id: version
        run: |
          INSPIRCD_VERSION=$(curl https://api.github.com/repos/inspircd/inspircd/releases | jq --raw-output 'map(select((.draft or .prerelease | not) and (.tag_name | startswith("v4.")))) | first .tag_name | .[1:]')
          if [ -z "${INSPIRCD_VERSION}" ]
          then
            exit 1
          fi
          echo "Building packages for InspIRCd ${INSPIRCD_VERSION}"
          echo "INSPIRCD_VERSION=${INSPIRCD_VERSION}" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    env:
      INSPIRCD_DEB_PLATFORMS: ${{ matrix.package == 'deb' && matrix.platform || null }}
      INSPIRCD_RPM_PLATFORMS: ${{ matrix.package == 'rpm' && matrix.platform || null }}
      INSPIRCD_IGNORE_WARNINGS: 1
      INSPIRCD_VERSION: ${{ needs.version.outputs.INSPIRCD_VERSION }}
      INSPIRCD_PACKAGES: ${{ matrix.package }} html
      INSPIRCD_REVISION: ${{ github.sha }}
    needs:
      - version
    steps:
      - uses: actions/checkout@v6

      - name: Build packages
        run: ./build.sh

      - name: List packages
        run: cat ./build/packages.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: deb
            platform: debian-12
          - package: deb
            platform: debian-13
          - package: deb
            platform: debian-14
          - package: deb
            platform: ubuntu-22-04
          - package: deb
            platform: ubuntu-24-04
          - package: deb
            platform: ubuntu-26-04
          - package: rpm
            platform: rocky-8
          - package: rpm
            platform: rocky-9
          - package: rpm
            platform: rocky-10
